/**
 * STROKE FONT WITH ARC, BEZIER, AND POLYLINE PATH TRACING
 * ----------------------------------------------------------------------
 * Mathematical Primitives:
 *  - L(x1, y1, x2, y2): Straight chord
 *  - ARC(cx, cy, rx, ry, a0, a1, ccw, steps): Elliptical radial sweeps
 *  - BEZ(p0, p1, p2, p3, steps): Cubic Bézier for serpentine curves
 */

function L(x1, y1, x2, y2) {
  return [{ x: x1, y: y1 }, { x: x2, y: y2 }];
}

function ARC(cx, cy, rx, ry, a0, a1, ccw = false, steps = 10) {
  const pts = [];
  let span = a1 - a0;
  if (!ccw && span < 0) span += Math.PI * 2;
  if (ccw && span > 0) span -= Math.PI * 2;
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const a = a0 + span * t;
    pts.push({ x: cx + rx * Math.cos(a), y: cy + ry * Math.sin(a) });
  }
  return pts;
}

function BEZ(p0, p1, p2, p3, steps = 10) {
  const pts = [];
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const u = 1 - t;
    pts.push({
      x: u*u*u*p0.x + 3*u*u*t*p1.x + 3*u*t*t*p2.x + t*t*t*p3.x,
      y: u*u*u*p0.y + 3*u*u*t*p1.y + 3*u*t*t*p2.y + t*t*t*p3.y
    });
  }
  return pts;
}

// ----------------------------------------------------------------------
// TEXT COMPILER (Continuous Arc-Length Metric Pipeline)
// ----------------------------------------------------------------------
class TextPathCompiler {
  static compile(text, canvasWidth, canvasHeight) {
    const glyphW = 32;
    const glyphH = 46;
    const tracking = 10;
    const spaceW = 20;
    const lineH = 68;
    const marginX = 60;
    const maxWidth = canvasWidth - marginX * 2;

    const words = text.split(' ');
    const lines = [];
    let curLine = [];
    let curWidth = 0;

    words.forEach(w => {
      let wordW = 0;
      for (let ch of w) {
        wordW += glyphW + tracking;
      }
      if (curWidth + wordW > maxWidth && curLine.length > 0) {
        lines.push(curLine);
        curLine = [w];
        curWidth = wordW + spaceW;
      } else {
        curLine.push(w);
        curWidth += wordW + spaceW;
      }
    });
    if (curLine.length > 0) lines.push(curLine);

    const totalBlockH = lines.length * lineH;
    let startY = (canvasHeight - totalBlockH) / 2 + 10;
    if (startY < 45) startY = 45;

    const compiledStrokes = [];
    let globalDistance = 0;

    lines.forEach((lineWords, lineIdx) => {
      let lineTotalW = 0;
      lineWords.forEach((w, wi) => {
        lineTotalW += w.length * (glyphW + tracking);
        if (wi < lineWords.length - 1) lineTotalW += spaceW;
      });

      let cursorX = (canvasWidth - lineTotalW) / 2;
      const cursorY = startY + lineIdx * lineH;

      lineWords.forEach((word, wi) => {
        for (let ch of word) {
          const glyphStrokes = FONT[ch] || FONT['?'];
          glyphStrokes.forEach((stroke, sIdx) => {
            const worldPts = stroke.map(p => ({
              x: cursorX + p.x * glyphW,
              y: cursorY + p.y * glyphH
            }));

            const segments = [];
            let sLen = 0;
            for (let i = 0; i < worldPts.length - 1; i++) {
              const p0 = worldPts[i];
              const p1 = worldPts[i + 1];
              const len = Math.hypot(p1.x - p0.x, p1.y - p0.y);
              segments.push({
                p0,
                p1,
                len,
                accumStart: sLen,
                accumEnd: sLen + len
              });
              sLen += len;
            }

            if (segments.length > 0) {
              compiledStrokes.push({
                char: ch,
                strokeIdx: sIdx + 1,
                totalStrokes: glyphStrokes.length,
                pts: worldPts,
                segments,
                totalLength: sLen,
                globalStart: globalDistance,
                globalEnd: globalDistance + sLen
              });
              globalDistance += sLen;
            }
          });
          cursorX += glyphW + tracking;
        }
        cursorX += spaceW;
      });
    });

    return { strokes: compiledStrokes, totalPathLength: globalDistance };
  }
}

// ----------------------------------------------------------------------
// PARTICLE SPARK SYSTEM (Galvo Ablation / Micro-speckle)
// ----------------------------------------------------------------------
class SparkEmitter {
  constructor() {
    this.sparks = [];
  }
  emit(x, y, vx, vy, count = 2) {
    for (let i = 0; i < count; i++) {
      const angle = Math.atan2(vy, vx) + Math.PI + (Math.random() - 0.5) * 2.0;
      const spd = Math.random() * 50 + 15;
      this.sparks.push({
        x, y,
        vx: Math.cos(angle) * spd,
        vy: Math.sin(angle) * spd,
        life: 1.0,
        decay: Math.random() * 2.8 + 2.2,
        size: Math.random() * 1.6 + 0.8
      });
    }
  }
  update(dt) {
    for (let i = this.sparks.length - 1; i >= 0; i--) {
      const s = this.sparks[i];
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      s.life -= s.decay * dt;
      if (s.life <= 0) this.sparks.splice(i, 1);
    }
  }
  draw(ctx) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    this.sparks.forEach(s => {
      ctx.fillStyle = `rgba(200, 255, 245, ${s.life * 0.9})`;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.restore();
  }
}

// ----------------------------------------------------------------------
// RUNTIME SETUP & ANIMATION LOOP
// ----------------------------------------------------------------------
const canvas = document.getElementById('laserCanvas');
const ctx = canvas.getContext('2d');
const textInput = document.getElementById('textInput');
const speedSlider = document.getElementById('speedSlider');
const speedVal = document.getElementById('speedVal');

const statusLabel = document.getElementById('status-label');
const charLabel = document.getElementById('char-label');
const strokeLabel = document.getElementById('stroke-label');
const arcLabel = document.getElementById('arc-label');
const totalArcLabel = document.getElementById('total-arc-label');
const headXLabel = document.getElementById('head-x');
const headYLabel = document.getElementById('head-y');

const emitter = new SparkEmitter();
let showBlanking = true;
let speed = 950;
let currentProgress = 0;
let lastTime = performance.now();
let compiledData = { strokes: [], totalPathLength: 0 };

function rebuildPath() {
  compiledData = TextPathCompiler.compile(textInput.value, canvas.width, canvas.height);
  currentProgress = 0;
  emitter.sparks = [];
  totalArcLabel.textContent = compiledData.totalPathLength.toFixed(1);
  statusLabel.textContent = "ACTIVE_EMISSION";
  statusLabel.style.color = "#00ffc8";
}

function sampleHead(s) {
  const { strokes, totalPathLength } = compiledData;
  for (let i = 0; i < strokes.length; i++) {
    const stroke = strokes[i];
    if (s >= stroke.globalStart && s <= stroke.globalEnd) {
      const localS = s - stroke.globalStart;
      for (const seg of stroke.segments) {
        if (localS >= seg.accumStart && localS <= seg.accumEnd) {
          const t = seg.len === 0 ? 0 : (localS - seg.accumStart) / seg.len;
          return {
            x: seg.p0.x + (seg.p1.x - seg.p0.x) * t,
            y: seg.p0.y + (seg.p1.y - seg.p0.y) * t,
            nx: (seg.p1.x - seg.p0.x) / (seg.len || 1),
            ny: (seg.p1.y - seg.p0.y) / (seg.len || 1),
            char: stroke.char,
            strokeNum: `${stroke.strokeIdx}/${stroke.totalStrokes}`
          };
        }
      }
    }
  }
  if (strokes.length > 0) {
    const last = strokes[strokes.length - 1];
    const pt = last.pts[last.pts.length - 1];
    return { x: pt.x, y: pt.y, nx: 0, ny: 0, char: "DONE", strokeNum: "--" };
  }
  return { x: 0, y: 0, nx: 0, ny: 0, char: "--", strokeNum: "--" };
}

function render(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;

  const { strokes, totalPathLength } = compiledData;

  if (currentProgress < totalPathLength) {
    currentProgress += speed * dt;
    if (currentProgress > totalPathLength) currentProgress = totalPathLength;
  } else {
    statusLabel.textContent = "IDLE (SCAN_COMPLETE)";
    statusLabel.style.color = "#58988a";
  }

  const head = sampleHead(currentProgress);

  // Spark Generation
  if (currentProgress < totalPathLength) {
    emitter.emit(head.x, head.y, head.nx * speed, head.ny * speed, 1);
  }
  emitter.update(dt);

  // Telemetry HUD Updates
  arcLabel.textContent = currentProgress.toFixed(1);
  charLabel.textContent = head.char;
  strokeLabel.textContent = head.strokeNum;
  headXLabel.textContent = head.x.toFixed(1);
  headYLabel.textContent = head.y.toFixed(1);

  // Background Clear (Phosphor retention)
  ctx.fillStyle = "rgba(2, 3, 5, 0.84)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // PASS 1: Galvo Transit / Blanking flyback
  if (showBlanking && strokes.length > 1) {
    ctx.save();
    ctx.strokeStyle = "rgba(0, 255, 200, 0.07)";
    ctx.lineWidth = 1;
    ctx.setLineDash([2, 5]);
    ctx.beginPath();
    for (let i = 0; i < strokes.length - 1; i++) {
      if (currentProgress >= strokes[i].globalEnd) {
        const pEnd = strokes[i].pts[strokes[i].pts.length - 1];
        const pNext = strokes[i + 1].pts[0];
        ctx.moveTo(pEnd.x, pEnd.y);
        ctx.lineTo(pNext.x, pNext.y);
      }
    }
    ctx.stroke();
    ctx.restore();
  }

  // PASS 2: Multi-Pass Coherent Beam Radiance
  const passes = [
    { width: 8.5, color: "rgba(0, 255, 200, 0.08)", blur: 14 },
    { width: 3.2, color: "rgba(40, 255, 220, 0.40)", blur: 4 },
    { width: 1.2, color: "rgba(255, 255, 255, 0.95)", blur: 0 }
  ];

  passes.forEach(pass => {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = pass.color;
    ctx.lineWidth = pass.width;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    if (pass.blur > 0) {
      ctx.shadowColor = "rgba(0, 255, 200, 0.6)";
      ctx.shadowBlur = pass.blur;
    }

    strokes.forEach(stroke => {
      if (currentProgress < stroke.globalStart) return;

      const visibleDist = Math.min(currentProgress - stroke.globalStart, stroke.totalLength);

      ctx.beginPath();
      ctx.moveTo(stroke.pts[0].x, stroke.pts[0].y);

      for (const seg of stroke.segments) {
        if (visibleDist >= seg.accumEnd) {
          ctx.lineTo(seg.p1.x, seg.p1.y);
        } else if (visibleDist > seg.accumStart) {
          const t = (visibleDist - seg.accumStart) / seg.len;
          ctx.lineTo(seg.p0.x + (seg.p1.x - seg.p0.x) * t, seg.p0.y + (seg.p1.y - seg.p0.y) * t);
          break;
        } else {
          break;
        }
      }
      ctx.stroke();
    });
    ctx.restore();
  });

  // PASS 3: Galvo Corner Dwell Heat Burns
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  strokes.forEach(stroke => {
    if (currentProgress < stroke.globalStart) return;
    stroke.segments.forEach(seg => {
      if (currentProgress >= stroke.globalStart + seg.accumEnd) {
        const grad = ctx.createRadialGradient(seg.p1.x, seg.p1.y, 0, seg.p1.x, seg.p1.y, 3.5);
        grad.addColorStop(0, "rgba(255, 255, 255, 0.7)");
        grad.addColorStop(0.5, "rgba(0, 255, 210, 0.25)");
        grad.addColorStop(1, "rgba(0, 0, 0, 0)");
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(seg.p1.x, seg.p1.y, 3.5, 0, Math.PI * 2);
        ctx.fill();
      }
    });
  });
  ctx.restore();

  // PASS 4: Active Spot Corona & Crosshair Collimation
  if (currentProgress < totalPathLength) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';

    const flare = ctx.createRadialGradient(head.x, head.y, 0, head.x, head.y, 16);
    flare.addColorStop(0, 'rgba(255, 255, 255, 1.0)');
    flare.addColorStop(0.15, 'rgba(120, 255, 230, 0.85)');
    flare.addColorStop(0.4, 'rgba(0, 255, 190, 0.25)');
    flare.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = flare;
    ctx.beginPath();
    ctx.arc(head.x, head.y, 16, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = "rgba(180, 255, 240, 0.4)";
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(head.x - 12, head.y); ctx.lineTo(head.x + 12, head.y);
    ctx.moveTo(head.x, head.y - 12); ctx.lineTo(head.x, head.y + 12);
    ctx.stroke();

    ctx.restore();
  }

  // PASS 5: Micro-speckle Particles
  emitter.draw(ctx);

  requestAnimationFrame(render);
}

// ----------------------------------------------------------------------
// EVENT LISTENERS & PRESETS
// ----------------------------------------------------------------------
document.getElementById('btn-fire').addEventListener('click', rebuildPath);
textInput.addEventListener('keydown', e => { if (e.key === 'Enter') rebuildPath(); });

document.getElementById('btn-preset-caps').addEventListener('click', () => {
  textInput.value = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  rebuildPath();
});

document.getElementById('btn-preset-lower').addEventListener('click', () => {
  textInput.value = "abcdefghijklmnopqrstuvwxyz";
  rebuildPath();
});

document.getElementById('btn-preset-digits').addEventListener('click', () => {
  textInput.value = "0123456789 2026";
  rebuildPath();
});

document.getElementById('btn-preset-pangram').addEventListener('click', () => {
  textInput.value = "The quick brown fox jumps over the lazy dog.";
  rebuildPath();
});

document.getElementById('btn-toggle-blanking').addEventListener('click', () => {
  showBlanking = !showBlanking;
});

speedSlider.addEventListener('input', e => {
  speed = parseInt(e.target.value, 10);
  speedVal.textContent = `${speed} px/s`;
});

// Initialize
rebuildPath();
requestAnimationFrame(render);
</script>
</body>
</html>
