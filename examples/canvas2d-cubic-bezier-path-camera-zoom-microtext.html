<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canvas 2D Cubic Bezier Path Camera Zoom and Microtext</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #07080b;
      color: #e5e7eb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    /* HUD Overlays */
    .hud-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px 32px;
      font-family: "JetBrains Mono", "SF Mono", Consolas, monospace;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .hud-tag {
      display: inline-block;
      padding: 4px 8px;
      background: rgba(0, 242, 254, 0.08);
      border: 1px solid rgba(0, 242, 254, 0.3);
      color: #00f2fe;
      border-radius: 2px;
      margin-bottom: 6px;
    }
    .telemetry {
      color: #8e95a5;
      line-height: 1.6;
    }
    .telemetry span {
      color: #f3f4f6;
      font-weight: 600;
    }
    .hud-bottom {
      display: flex;
      flex-direction: column;
      gap: 16px;
      pointer-events: auto;
    }
    .controls-panel {
      background: rgba(13, 15, 22, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 12px 20px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 20px;
      width: fit-content;
      margin: 0 auto;
    }
    .btn {
      background: #1a1d27;
      border: 1px solid #2d3345;
      color: #f3f4f6;
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
      font-size: 11px;
      transition: all 0.15s ease;
    }
    .btn:hover {
      background: #252a3a;
      border-color: #00f2fe;
      color: #00f2fe;
    }
    .scrubber-container {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 320px;
    }
    .scrubber {
      flex: 1;
      height: 4px;
      accent-color: #00f2fe;
      cursor: pointer;
    }
    .phase-indicator {
      font-weight: 600;
      color: #00f2fe;
    }

    .mode-panel {
      gap: 8px;
      padding: 8px 10px;
    }

    .mode-btn.active {
      background: #00f2fe;
      border-color: #00f2fe;
      color: #071014;
      font-weight: 800;
    }

    .mode-label {
      color: #6b7280;
      padding: 0 6px;
    }

    .hud-layer.light-stage .telemetry {
      color: #475569;
    }

    .hud-layer.light-stage .telemetry span {
      color: #111827;
    }

    .hud-layer.light-stage .hud-tag {
      background: rgba(0, 80, 100, 0.08);
      color: #006978;
      border-color: rgba(0, 80, 100, 0.25);
    }
  </style>
</head>
<body>

  <canvas id="viewport"></canvas>

  <div class="hud-layer">
    <div class="hud-top">
      <div>
        <div class="hud-tag">Canvas 2D // Cubic Bezier Path Camera Zoom</div>
        <div class="telemetry">
          MODE: <span id="telemetry-phase" class="phase-indicator">MACRO ANCHOR</span><br>
          SCALE: <span id="telemetry-zoom">1.000x</span><br>
          TARGET: <span id="telemetry-target">CUBIC BEZIER PATH // START SAMPLE</span>
        </div>
      </div>
      <div style="text-align: right;">
        <div class="telemetry">
          VECTOR SEAM: <span>[s: 55.00 -> 63.40]</span><br>
          SURFACE TANGENT: <span id="telemetry-tangent">0.00°</span><br>
          FPS: <span id="telemetry-fps">60</span>
        </div>
      </div>
    </div>

    <div class="hud-bottom">
      <div class="controls-panel mode-panel">
        <span class="mode-label">VARIATION</span>
        <button class="btn mode-btn active" data-mode="edge">EDGE</button>
        <button class="btn mode-btn" data-mode="flat">FLAT TOP</button>
        <button class="btn mode-btn" data-mode="inside">BLACK IN STROKE</button>
        <button class="btn mode-btn" data-mode="second_zoom">STROKE INTERIOR SECOND ZOOM</button>
      </div>
      <div class="controls-panel">
        <button class="btn" id="btn-toggle">PAUSE</button>
        <button class="btn" id="btn-restart">RESTART</button>
        <div class="scrubber-container">
          <span style="color: #6b7280;">0.0s</span>
          <input type="range" class="scrubber" id="time-scrubber" min="0" max="14" step="0.01" value="0">
          <span style="color: #6b7280;">14.0s</span>
        </div>
        <button class="btn" id="btn-speed">1.0x</button>
      </div>
    </div>
  </div>

  <script>
    // --- MATHEMATICAL FOUNDATION: PARAMETRIC CUBIC BEZIER SPLINE ---
    class CubicBezierSpline {
      constructor(curves) {
        this.curves = curves; // Array of [[p0, p1, p2, p3], ...]
        this.samples = [];
        this.totalLength = 0;
        this.init();
      }

      init() {
        const STEPS = 300;
        this.samples = [];
        this.totalLength = 0;
        let prev = null;

        for (let c = 0; c < this.curves.length; c++) {
          const [p0, p1, p2, p3] = this.curves[c];
          for (let i = 0; i <= STEPS; i++) {
            if (c > 0 && i === 0) continue;
            const t = i / STEPS;
            const pt = this.evalCurve(p0, p1, p2, p3, t);
            const tg = this.evalTangent(p0, p1, p2, p3, t);
            let dist = 0;
            if (prev) {
              dist = Math.hypot(pt.x - prev.x, pt.y - prev.y);
            }
            this.totalLength += dist;
            this.samples.push({
              x: pt.x,
              y: pt.y,
              tangent: tg,
              dist: this.totalLength
            });
            prev = pt;
          }
        }
      }

      evalCurve(p0, p1, p2, p3, t) {
        const it = 1 - t;
        const it2 = it * it;
        const it3 = it2 * it;
        const t2 = t * t;
        const t3 = t2 * t;
        return {
          x: it3 * p0.x + 3 * it2 * t * p1.x + 3 * it * t2 * p2.x + t3 * p3.x,
          y: it3 * p0.y + 3 * it2 * t * p1.y + 3 * it * t2 * p2.y + t3 * p3.y
        };
      }

      evalTangent(p0, p1, p2, p3, t) {
        const it = 1 - t;
        const dx = 3 * it * it * (p1.x - p0.x) + 6 * it * t * (p2.x - p1.x) + 3 * t * t * (p3.x - p2.x);
        const dy = 3 * it * it * (p1.y - p0.y) + 6 * it * t * (p2.y - p1.y) + 3 * t * t * (p3.y - p2.y);
        const len = Math.hypot(dx, dy) || 1;
        const tx = dx / len;
        const ty = dy / len;
        return {
          x: tx,
          y: ty,
          angle: Math.atan2(ty, tx),
          // Left-hand unit normal vector:
          nx: -ty,
          ny: tx
        };
      }

      // Continuous arc-length lookup
      sampleAtDistance(d) {
        d = Math.max(0, Math.min(this.totalLength, d));
        let low = 0, high = this.samples.length - 1;
        while (low <= high) {
          const mid = (low + high) >> 1;
          if (this.samples[mid].dist < d) low = mid + 1;
          else high = mid - 1;
        }
        const idx = Math.max(0, Math.min(this.samples.length - 1, low));
        if (idx === 0) return this.samples[0];
        const s0 = this.samples[idx - 1];
        const s1 = this.samples[idx];
        const span = s1.dist - s0.dist;
        const f = span > 0.00001 ? (d - s0.dist) / span : 0;

        const angleDiff = s1.tangent.angle - s0.tangent.angle;
        return {
          x: s0.x + (s1.x - s0.x) * f,
          y: s0.y + (s1.y - s0.y) * f,
          tangentAngle: s0.tangent.angle + angleDiff * f,
          nx: s0.tangent.nx + (s1.tangent.nx - s0.tangent.nx) * f,
          ny: s0.tangent.ny + (s1.tangent.ny - s0.tangent.ny) * f
        };
      }
    }

    // --- SCENE CONFIGURATION & SPLINE DEFINITION ---
    // The spine of the letter "S" inside the phrase "LOOK CLOSER"
    const S_CURVE = [
      [ { x: 620, y: 255 }, { x: 535, y: 242 }, { x: 485, y: 300 }, { x: 555, y: 355 } ],
      [ { x: 555, y: 355 }, { x: 625, y: 410 }, { x: 585, y: 475 }, { x: 495, y: 465 } ]
    ];
    const spline = new CubicBezierSpline(S_CURVE);
    const STROKE_WIDTH = 34; // World-space stroke width of the macro letter

    // Line 2: The sentence typed directly onto the stroke horizon
    const LINE2_TEXT = "we are the inhabitants of the thirty-second decimal place — riding the edge until language becomes landscape.";

    // Track position on spline:
    const S_START = 52.0;               // Start near the top crest of the S
    const CHAR_ADVANCE = 0.076;         // World distance per character
    const S_END = S_START + LINE2_TEXT.length * CHAR_ADVANCE; // ~60.3 units

    // --- CANVAS AND TIMELINE STATE ---
    const canvas = document.getElementById("viewport");
    const ctx = canvas.getContext("2d");

    let W = window.innerWidth;
    let H = window.innerHeight;
    let dpr = window.devicePixelRatio || 1;

    function resize() {
      W = window.innerWidth;
      H = window.innerHeight;
      dpr = window.devicePixelRatio || 1;
      canvas.width = W * dpr;
      canvas.height = H * dpr;
    }
    window.addEventListener("resize", resize);
    resize();

    // Timeline state
    let simTime = 0.0;
    const DURATION = 14.0;
    let isPlaying = true;
    let speedMultiplier = 1.0;
    let lastTimestamp = performance.now();

    // Rendering variation. The geometry stays shared; only camera/ink rules change.
    let visualMode = "edge";

    // UI elements
    const elZoom = document.getElementById("telemetry-zoom");
    const elPhase = document.getElementById("telemetry-phase");
    const elTangent = document.getElementById("telemetry-tangent");
    const elScrubber = document.getElementById("time-scrubber");
    const btnToggle = document.getElementById("btn-toggle");
    const btnRestart = document.getElementById("btn-restart");
    const btnSpeed = document.getElementById("btn-speed");
    const elFps = document.getElementById("telemetry-fps");
    const hudLayer = document.querySelector(".hud-layer");
    const modeButtons = [...document.querySelectorAll(".mode-btn")];

    let frameCount = 0;
    let lastFpsUpdate = performance.now();

    // --- CAMERA CALCULATION ---
    // Smooth transition functions
    function easeInOutCubic(x) {
      return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
    }
    function smoothstep(min, max, value) {
      const x = Math.max(0, Math.min(1, (value - min) / (max - min)));
      return x * x * (3 - 2 * x);
    }

    function getCameraState(t) {
      // Phase boundaries (in seconds)
      // 0.0 - 2.0s : Macro view (Zoom = 1x)
      // 2.0 - 5.5s : Exponential Zoom Drop (1x -> 180x)
      // 5.5 - 11.2s: Riding the Stroke (Typing Phase)
      // 11.2 - 12.8s: Micro Inspection on the final period
      // 12.8 - 14.0s: Cinematic pull-back loop reset

      const macroCenter = { x: 560, y: 350 };
      const macroZoom = 1.0;
      const microZoom = 180.0;

      // Sample starting surface point on the outer edge
      const pStart = spline.sampleAtDistance(S_START);
      const startEdge = {
        x: pStart.x + pStart.nx * (STROKE_WIDTH / 2),
        y: pStart.y + pStart.ny * (STROKE_WIDTH / 2)
      };

      let camX, camY, zoom, camAngle, phaseName, currentS;

      if (t < 2.0) {
        // --- PHASE 1: MACRO ANCHOR ---
        phaseName = "MACRO ANCHOR";
        camX = macroCenter.x;
        camY = macroCenter.y;
        zoom = macroZoom;
        camAngle = 0;
        currentS = S_START;
      } else if (t < 5.5) {
        // --- PHASE 2: EXPONENTIAL CAMERA ZOOM ---
        phaseName = "EXPONENTIAL DESCENT";
        const p = (t - 2.0) / 3.5;
        const ep = easeInOutCubic(p);

        // Exponential zoom: S(t) = S0 * e^(k*t)
        const logZ0 = Math.log(macroZoom);
        const logZ1 = Math.log(microZoom);
        zoom = Math.exp(logZ0 + (logZ1 - logZ0) * ep);

        camX = macroCenter.x + (startEdge.x - macroCenter.x) * ep;
        camY = macroCenter.y + (startEdge.y - macroCenter.y) * ep;

        // Rotate so surface tangent becomes horizontal:
        // When tangent is aligned with screen +X, tangentAngle + camAngle = 0 => camAngle = -tangentAngle
        const targetAngle = -pStart.tangentAngle;
        camAngle = targetAngle * ep;
        currentS = S_START;
      } else if (t < 11.2) {
        // --- PHASE 3: RIDING THE STROKE ---
        phaseName = "RIDING THE STROKE";
        zoom = microZoom;
        const p = (t - 5.5) / 5.7;
        currentS = S_START + p * (S_END - S_START);

        const pt = spline.sampleAtDistance(currentS);
        // Position camera exactly at the edge point
        camX = pt.x + pt.nx * (STROKE_WIDTH / 2);
        camY = pt.y + pt.ny * (STROKE_WIDTH / 2);
        camAngle = -pt.tangentAngle;
      } else if (t < 12.8) {
        // --- PHASE 4: MICRO INSPECTION (THE PERIOD) ---
        phaseName = "MICRO RECURSION";
        const p = (t - 11.2) / 1.6;
        currentS = S_END;
        const pt = spline.sampleAtDistance(S_END);
        camX = pt.x + pt.nx * (STROKE_WIDTH / 2);
        camY = pt.y + pt.ny * (STROKE_WIDTH / 2);
        camAngle = -pt.tangentAngle;
        // Subtle secondary micro-pulse
        zoom = microZoom * (1 + 0.35 * Math.sin(p * Math.PI));
      } else {
        // --- PHASE 5: PULLBACK RESET ---
        phaseName = "LOOP RESET";
        const p = (t - 12.8) / 1.2;
        const ep = easeInOutCubic(p);

        const pt = spline.sampleAtDistance(S_END);
        const lastEdge = {
          x: pt.x + pt.nx * (STROKE_WIDTH / 2),
          y: pt.y + pt.ny * (STROKE_WIDTH / 2)
        };

        const logZ0 = Math.log(microZoom);
        const logZ1 = Math.log(macroZoom);
        zoom = Math.exp(logZ0 + (logZ1 - logZ0) * ep);

        camX = lastEdge.x + (macroCenter.x - lastEdge.x) * ep;
        camY = lastEdge.y + (macroCenter.y - lastEdge.y) * ep;
        camAngle = (-pt.tangentAngle) * (1 - ep);
        currentS = S_START;
      }

      // Variations deliberately share the same spline and timeline.
      // FIXED ROTATION: camera rotation remains zero and position stops tracking the curve after the initial zoom.
      if (visualMode === "flat") {
        camAngle = 0;
        if (t >= 5.5 && t < 12.8) {
          camX = startEdge.x;
          camY = startEdge.y;
        }
        phaseName = t < 5.5 ? "FLAT DESCENT" : (t < 12.8 ? "TOP OF S" : "FLAT RESET");
      }

      // SECOND ZOOM: reuse the stroke-interior colors and apply another zoom at the end.
      if (visualMode === "second_zoom") {
        phaseName = t < 5.5 ? "ENTER STROKE" :
                    t < 11.2 ? "BLACK INK / WHITE BODY" :
                    t < 12.8 ? "SECOND DESCENT" :
                               "MICRO DESCENT";

        if (t >= 11.2) {
          currentS = S_END;
          const pt = spline.sampleAtDistance(S_END);
          camX = pt.x + pt.nx * (STROKE_WIDTH / 2);
          camY = pt.y + pt.ny * (STROKE_WIDTH / 2);
          camAngle = -pt.tangentAngle;

          const pA = Math.max(0, Math.min(1, (t - 11.2) / 1.6));
          const pB = Math.max(0, Math.min(1, (t - 12.8) / 1.2));
          const firstZoom = Math.exp(Math.log(microZoom) + (Math.log(420) - Math.log(microZoom)) * easeInOutCubic(pA));
          const secondZoom = Math.exp(Math.log(420) + (Math.log(900) - Math.log(420)) * easeInOutCubic(pB));
          zoom = t < 12.8 ? firstZoom : secondZoom;

          // Move inward from the edge during the second zoom.
          const inward = t < 12.8 ? (1.0 + 2.2 * pA) : (3.2 + 3.8 * pB);
          camX -= pt.nx * inward;
          camY -= pt.ny * inward;
        }
      }

      if (visualMode === "inside") {
        phaseName = t < 5.5 ? "ENTER STROKE" :
                    t < 12.8 ? "BLACK INK / WHITE BODY" : "EXIT STROKE";
      }

      return { camX, camY, zoom, camAngle, phaseName, currentS };
    }

    // Precise world-to-screen transform
    function worldToScreen(wx, wy, camX, camY, zoom, angle) {
      const dx = wx - camX;
      const dy = wy - camY;
      const cosA = Math.cos(angle);
      const sinA = Math.sin(angle);
      const rx = dx * cosA - dy * sinA;
      const ry = dx * sinA + dy * cosA;
      return {
        x: rx * zoom + W / 2,
        // Lower the surface slightly on screen (offset by +H*0.14) to create an expansive sky
        y: ry * zoom + H / 2 + (zoom > 10 ? H * 0.14 : 0)
      };
    }

    // --- RENDER ROUTINES ---

    function drawScene() {
      // Clear viewport
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = "#07080b";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const state = getCameraState(simTime);
      const { camX, camY, zoom, camAngle, phaseName, currentS } = state;

      // Update UI Telemetry
      elZoom.innerText = zoom.toFixed(3) + "x";
      elPhase.innerText = phaseName;
      elTangent.innerText = ((-camAngle * 180) / Math.PI).toFixed(1) + "°";
      elScrubber.value = simTime.toFixed(2);

      // This mode does not invert the complete canvas, so the HUD retains its default styling.
      const recursiveWhiteWorld = false;
      hudLayer.classList.toggle("light-stage", recursiveWhiteWorld);

      // Setup Camera Context
      ctx.save();
      ctx.scale(dpr, dpr);

      // The macro world remains common to all modes.
      drawWorldGrid(camX, camY, zoom, camAngle);

      ctx.save();
      ctx.translate(W / 2, H / 2 + (zoom > 10 ? H * 0.14 : 0));
      ctx.scale(zoom, zoom);
      ctx.rotate(camAngle);
      ctx.translate(-camX, -camY);
      drawMacroTypography(zoom);
      ctx.restore();

      if (visualMode === "edge") {
        if (zoom > 15) drawSurfaceHorizonDetails(camX, camY, zoom, camAngle);
        drawLine2TextAlongPath(currentS, camX, camY, zoom, camAngle, false);
      } else if (visualMode === "flat") {
        drawFlatTopText(camX, camY, zoom, camAngle);
      } else if (visualMode === "inside") {
        if (zoom > 15) drawSurfaceHorizonDetails(camX, camY, zoom, camAngle);
        drawLine2TextAlongPath(currentS, camX, camY, zoom, camAngle, true);
      } else if (visualMode === "second_zoom") {
        if (zoom > 15) drawSurfaceHorizonDetails(camX, camY, zoom, camAngle);
        drawLine2TextAlongPath(currentS, camX, camY, zoom, camAngle, true);
      }

      if (zoom < 30 && visualMode !== "second_zoom") {
        drawTargetReticle(camX, camY, zoom, camAngle);
      }

      ctx.restore();
    }

    function drawWorldGrid(camX, camY, zoom, camAngle) {
      if (zoom > 50) return; // Keep high-zoom view clean
      ctx.save();
      ctx.strokeStyle = "rgba(255, 255, 255, 0.035)";
      ctx.lineWidth = 1;
      const gridSize = 80 * zoom;
      const offsetX = (W / 2 - camX * zoom) % gridSize;
      const offsetY = (H / 2 - camY * zoom) % gridSize;

      ctx.beginPath();
      for (let x = offsetX; x < W; x += gridSize) {
        ctx.moveTo(x, 0);
        ctx.lineTo(x, H);
      }
      for (let y = offsetY; y < H; y += gridSize) {
        ctx.moveTo(0, y);
        ctx.lineTo(W, y);
      }
      ctx.stroke();
      ctx.restore();
    }

    function drawMacroTypography(zoom) {
      // 1. Top Sub-header
      ctx.font = "900 24px -apple-system, BlinkMacSystemFont, sans-serif";
      ctx.fillStyle = "rgba(255, 255, 255, 0.28)";
      ctx.letterSpacing = "0.45em";
      ctx.fillText("L O O K", 475, 175);

      // 2. Primary Massive Word: "CLOSER"
      // Letters C, L, O, E, R are rendered with heavy sans-serif.
      // The letter "S" is rendered via the mathematical spline to guarantee 1:1 topological alignment!
      ctx.font = "900 148px -apple-system, BlinkMacSystemFont, sans-serif";
      ctx.fillStyle = "#ffffff";
      ctx.letterSpacing = "0.02em";

      ctx.fillText("C", 260, 465);
      ctx.fillText("L", 360, 465);
      ctx.fillText("O", 445, 465);
      // 'S' is drawn below via spline stroke
      ctx.fillText("E", 645, 465);
      ctx.fillText("R", 735, 465);

      // Render the "S" stroke
      ctx.save();
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.lineWidth = STROKE_WIDTH;
      ctx.strokeStyle = "#ffffff";

      ctx.beginPath();
      const samples = spline.samples;
      ctx.moveTo(samples[0].x, samples[0].y);
      for (let i = 1; i < samples.length; i++) {
        ctx.lineTo(samples[i].x, samples[i].y);
      }
      ctx.stroke();

      // Subtle core spine
      if (zoom < 5) {
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = "rgba(0, 242, 254, 0.4)";
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawTargetReticle(camX, camY, zoom, camAngle) {
      const pStart = spline.sampleAtDistance(S_START);
      const edge = {
        x: pStart.x + pStart.nx * (STROKE_WIDTH / 2),
        y: pStart.y + pStart.ny * (STROKE_WIDTH / 2)
      };
      const scr = worldToScreen(edge.x, edge.y, camX, camY, zoom, camAngle);

      const radius = 26 * Math.max(0.4, 1.0 - (zoom - 1) / 10);
      const alpha = Math.max(0, 1.0 - (zoom - 1) / 4);

      if (alpha <= 0) return;

      ctx.save();
      ctx.translate(scr.x, scr.y);
      ctx.strokeStyle = `rgba(0, 242, 254, ${alpha * 0.8})`;
      ctx.fillStyle = `rgba(0, 242, 254, ${alpha})`;
      ctx.lineWidth = 1;

      // Reticle Brackets
      const b = radius;
      const s = 6;
      ctx.beginPath();
      // Top-left
      ctx.moveTo(-b, -b + s); ctx.lineTo(-b, -b); ctx.lineTo(-b + s, -b);
      // Top-right
      ctx.moveTo(b - s, -b); ctx.lineTo(b, -b); ctx.lineTo(b, -b + s);
      // Bottom-left
      ctx.moveTo(-b, b - s); ctx.lineTo(-b, b); ctx.lineTo(-b + s, b);
      // Bottom-right
      ctx.moveTo(b - s, b); ctx.lineTo(b, b); ctx.lineTo(b, b - s);
      ctx.stroke();

      // Center dot
      ctx.beginPath();
      ctx.arc(0, 0, 1.5, 0, Math.PI * 2);
      ctx.fill();

      // Label
      ctx.font = "9px 'JetBrains Mono', monospace";
      ctx.fillText("FOCAL SEAM // P[0]", b + 8, 3);
      ctx.restore();
    }

    function drawSurfaceHorizonDetails(camX, camY, zoom, camAngle) {
      // Renders survey tick marks, elevation notches, and horizon edge luminescence
      ctx.save();
      ctx.strokeStyle = "rgba(0, 242, 254, 0.25)";
      ctx.fillStyle = "rgba(0, 242, 254, 0.4)";
      ctx.lineWidth = 1;
      ctx.font = "8px 'JetBrains Mono', monospace";

      const step = 0.5; // Every 0.5 world units
      const minS = Math.max(0, S_START - 8);
      const maxS = Math.min(spline.totalLength, S_END + 15);

      for (let s = minS; s <= maxS; s += step) {
        const pt = spline.sampleAtDistance(s);
        const edgeX = pt.x + pt.nx * (STROKE_WIDTH / 2);
        const edgeY = pt.y + pt.ny * (STROKE_WIDTH / 2);
        const scr = worldToScreen(edgeX, edgeY, camX, camY, zoom, camAngle);

        // Cull off-screen ticks
        if (scr.x < -50 || scr.x > W + 50) continue;

        const rot = pt.tangentAngle + camAngle;
        ctx.save();
        ctx.translate(scr.x, scr.y);
        ctx.rotate(rot);

        // Tick mark along normal
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(0, 7); // Away from the solid body
        ctx.stroke();

        if (Math.round(s * 2) % 4 === 0) {
          ctx.fillText((s - S_START).toFixed(1), -6, 18);
        }
        ctx.restore();
      }
      ctx.restore();
    }

    // --- MICROTEXT POSITIONING ALONG THE STROKE ---
    // Flat/no-roll variation: characters ride the top edge of the S, but remain upright on screen.
    function drawFlatTopText(camX, camY, zoom, camAngle) {
      if (zoom < 8) return;

      const p = Math.max(0, Math.min(1, (simTime - 5.5) / 5.7));
      const currentS = S_START + p * (S_END - S_START);
      ctx.save();
      ctx.font = "700 17px 'JetBrains Mono', 'SF Mono', Consolas, monospace";
      ctx.textAlign = "center";
      ctx.textBaseline = "bottom";

      let lastScr = null;

      for (let i = 0; i < LINE2_TEXT.length; i++) {
        const charS = S_START + i * CHAR_ADVANCE;
        if (charS > currentS) break;

        const pt = spline.sampleAtDistance(charS);
        const edgeX = pt.x + pt.nx * (STROKE_WIDTH / 2);
        const edgeY = pt.y + pt.ny * (STROKE_WIDTH / 2);
        const scr = worldToScreen(edgeX, edgeY, camX, camY, zoom, camAngle);

        lastScr = { x: scr.x, y: scr.y };
        if (scr.x < -40 || scr.x > W + 40 || scr.y < -80 || scr.y > H + 80) continue;

        const isRecent = Math.abs(charS - currentS) < CHAR_ADVANCE * 2;
        if (isRecent) {
          ctx.fillStyle = "#00f2fe";
          ctx.shadowColor = "#00f2fe";
          ctx.shadowBlur = 10;
        } else {
          ctx.fillStyle = "#ffffff";
          ctx.shadowColor = "rgba(0,0,0,0.75)";
          ctx.shadowBlur = 4;
        }

        // No rotation here: glyphs stay upright while their anchor points ride the stroke.
        ctx.fillText(LINE2_TEXT[i], scr.x, scr.y - 2);
      }

      if (lastScr) {
        const blink = Math.sin(performance.now() * 0.012) * 0.5 + 0.5;
        ctx.fillStyle = "rgba(0, 242, 254, " + (0.4 + blink * 0.6) + ")";
        ctx.shadowColor = "#00f2fe";
        ctx.shadowBlur = 8;
        ctx.fillRect(lastScr.x + 6, lastScr.y - 18, 3, 16);
      }

      ctx.restore();
    }

    // Path renderer shared by the original edge mode and the "black ink inside white stroke" mode.
    function drawLine2TextAlongPath(currentS, camX, camY, zoom, camAngle, insideStroke = false) {
      if (zoom < 8) return;

      ctx.save();
      ctx.font = "600 15px 'JetBrains Mono', 'SF Mono', Consolas, monospace";
      ctx.textAlign = "center";
      ctx.textBaseline = insideStroke ? "bottom" : "top";

      let lastScr = null;

      for (let i = 0; i < LINE2_TEXT.length; i++) {
        const charS = S_START + i * CHAR_ADVANCE;
        if (charS > currentS) break;

        const pt = spline.sampleAtDistance(charS);
        const edgeX = pt.x + pt.nx * (STROKE_WIDTH / 2);
        const edgeY = pt.y + pt.ny * (STROKE_WIDTH / 2);
        const scr = worldToScreen(edgeX, edgeY, camX, camY, zoom, camAngle);

        lastScr = { x: scr.x, y: scr.y, angle: pt.tangentAngle + camAngle };
        if (scr.x < -40 || scr.x > W + 40 || scr.y < -80 || scr.y > H + 80) continue;

        const scrAngle = pt.tangentAngle + camAngle;
        ctx.save();
        ctx.translate(scr.x, scr.y);
        ctx.rotate(scrAngle);

        if (insideStroke) {
          // The solid body lies toward -normal from this +normal edge.
          // Black glyphs therefore sit just INSIDE the white stroke.
          ctx.fillStyle = "#050505";
          ctx.shadowColor = "transparent";
          ctx.shadowBlur = 0;
          ctx.fillText(LINE2_TEXT[i], 0, -4);
        } else {
          const isRecent = Math.abs(charS - currentS) < CHAR_ADVANCE * 2;
          if (isRecent) {
            ctx.fillStyle = "#00f2fe";
            ctx.shadowColor = "#00f2fe";
            ctx.shadowBlur = 10;
          } else {
            ctx.fillStyle = "#ffffff";
            ctx.shadowColor = "transparent";
          }
          ctx.fillText(LINE2_TEXT[i], 0, 4);
        }
        ctx.restore();
      }

      if (currentS >= S_START && currentS <= S_END + 0.5 && lastScr) {
        ctx.save();
        ctx.translate(lastScr.x, lastScr.y);
        ctx.rotate(lastScr.angle);

        const blink = Math.sin(performance.now() * 0.012) * 0.5 + 0.5;
        ctx.fillStyle = insideStroke
          ? `rgba(0, 0, 0, ${0.45 + blink * 0.55})`
          : `rgba(0, 242, 254, ${0.4 + blink * 0.6})`;
        ctx.shadowColor = insideStroke ? "transparent" : "#00f2fe";
        ctx.shadowBlur = insideStroke ? 0 : 8;
        ctx.fillRect(4, insideStroke ? -20 : 4, 3, 16);
        ctx.restore();
      }

      ctx.restore();
    }

    // Two-stage color inversion calculation:
    // black background -> white stroke interior -> white background/black text -> black glyph interior -> black background/white text.
    function drawTwoStageColorInversion() {
      const t = simTime;

      // First recursion: once the camera is deep in the white S, its body becomes the new world.
      const enterWhite = smoothstep(4.65, 5.65, t);
      if (enterWhite > 0) {
        ctx.save();
        ctx.globalAlpha = enterWhite;
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, W, H);
        ctx.restore();
      }

      if (t >= 5.15) {
        const reveal = Math.max(0, Math.min(1, (t - 5.15) / 2.2));
        const lineA = "WE ARE THE INHABITANTS";
        const lineB = "OF THE THIRTY-SECOND DECIMAL PLACE";
        const shownA = lineA.slice(0, Math.floor(lineA.length * Math.min(1, reveal * 1.55)));
        const shownB = lineB.slice(0, Math.floor(lineB.length * Math.max(0, (reveal - 0.42) * 1.75)));

        ctx.save();
        ctx.fillStyle = "#050505";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.font = "900 44px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif";
        ctx.fillText(shownA, W / 2, H * 0.43, W - 100);
        ctx.font = "700 22px 'JetBrains Mono', Consolas, monospace";
        ctx.fillText(shownB, W / 2, H * 0.52, W - 100);
        ctx.restore();
      }

      // Second recursion: target a black I-stem and magnify it until black itself becomes the new world.
      const p2 = Math.max(0, Math.min(1, (t - 8.15) / 2.55));
      if (p2 > 0) {
        const ep = easeInOutCubic(p2);
        const glyphZoom = Math.exp(Math.log(1) + (Math.log(34) * ep));

        ctx.save();
        ctx.translate(W / 2, H * 0.43);
        ctx.scale(glyphZoom, glyphZoom);
        ctx.fillStyle = "#050505";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.font = "900 68px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif";
        // A single I gives the zoom a solid target instead of an arbitrary crossfade.
        ctx.fillText("I", 0, 0);
        ctx.restore();

        // Once we're optically inside the black stem, black becomes the full next coordinate world.
        const enterBlack = smoothstep(0.72, 0.96, p2);
        if (enterBlack > 0) {
          ctx.save();
          ctx.globalAlpha = enterBlack;
          ctx.fillStyle = "#07080b";
          ctx.fillRect(0, 0, W, H);
          ctx.restore();
        }
      }

      if (t >= 10.15) {
        const p3 = smoothstep(10.15, 11.25, t);
        ctx.save();
        ctx.globalAlpha = p3;
        ctx.fillStyle = "#ffffff";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.font = "900 42px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif";
        ctx.fillText("LANGUAGE BECOMES LANDSCAPE", W / 2, H * 0.47, W - 100);
        ctx.font = "600 15px 'JetBrains Mono', Consolas, monospace";
        ctx.fillStyle = "#9ca3af";
        ctx.fillText("AND THE LANDSCAPE CONTAINS ANOTHER LINE", W / 2, H * 0.54, W - 120);
        ctx.restore();
      }
    }

    // --- MAIN TICK / ANIMATION LOOP ---
    function animate(timestamp) {
      const delta = (timestamp - lastTimestamp) / 1000;
      lastTimestamp = timestamp;

      // Compute FPS
      frameCount++;
      if (timestamp - lastFpsUpdate > 500) {
        elFps.innerText = Math.round((frameCount * 1000) / (timestamp - lastFpsUpdate));
        frameCount = 0;
        lastFpsUpdate = timestamp;
      }

      if (isPlaying) {
        simTime += delta * speedMultiplier;
        if (simTime > DURATION) {
          simTime = 0.0; // Loop cleanly
        }
      }

      drawScene();
      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);

    // --- USER CONTROLS & INTERACTION ---
    btnToggle.addEventListener("click", () => {
      isPlaying = !isPlaying;
      btnToggle.innerText = isPlaying ? "PAUSE" : "PLAY";
    });

    btnRestart.addEventListener("click", () => {
      simTime = 0;
      isPlaying = true;
      btnToggle.innerText = "PAUSE";
    });

    elScrubber.addEventListener("input", (e) => {
      simTime = parseFloat(e.target.value);
    });

    const speeds = [0.5, 1.0, 2.0];
    let speedIdx = 1;
    btnSpeed.addEventListener("click", () => {
      speedIdx = (speedIdx + 1) % speeds.length;
      speedMultiplier = speeds[speedIdx];
      btnSpeed.innerText = speedMultiplier.toFixed(1) + "x";
    });

    function setVisualMode(mode) {
      visualMode = mode;
      modeButtons.forEach(btn => btn.classList.toggle("active", btn.dataset.mode === mode));
      simTime = 0;
      isPlaying = true;
      btnToggle.innerText = "PAUSE";
      hudLayer.classList.remove("light-stage");
    }

    modeButtons.forEach(btn => {
      btn.addEventListener("click", () => setVisualMode(btn.dataset.mode));
    });

    window.addEventListener("keydown", (e) => {
      if (e.code === "Digit1") setVisualMode("edge");
      if (e.code === "Digit2") setVisualMode("flat");
      if (e.code === "Digit3") setVisualMode("inside");
      if (e.code === "Digit4") setVisualMode("second_zoom");
      if (e.code === "Space") {
        e.preventDefault();
        btnToggle.click();
      }
    });
  </script>
</body>
