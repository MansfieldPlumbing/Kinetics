<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas 2D Camera Zoom Through a Letter Counter with Color Inversion</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <canvas id="emitCanvas"></canvas>

    <script>
        const canvas = document.getElementById('emitCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let frameCount = 0;
        const loopDuration = 200; // Full animation cycle

        function animate() {
            frameCount++;
            if (frameCount >= loopDuration) {
                frameCount = 0;
            }

            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            // 1. Establish Stage 1: White Environment
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.font = "bold 90px sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            const word = "UNKNOWN";
            
            // Calculate exact position of the letter 'O' to use as the clean camera focal point
            const totalWidth = ctx.measureText(word).width;
            const prefixWidth = ctx.measureText("UNKN").width;
            const letterOWidth = ctx.measureText("O").width;
            
            // Define the focal point center coordinate directly inside the letter 'O'
            const focalX = -totalWidth / 2 + prefixWidth + letterOWidth / 2;

            // 2. Control Camera Zoom Progress Timeline
            let scale = 1;
            let opacity = 1;

            if (frameCount > 40 && frameCount <= 120) {
                // Smooth camera forward movement curve
                let t = (frameCount - 40) / 80;
                let ease = t * t * (3 - 2 * t); // Clean cubic ease
                scale = 1 + ease * 120; // Zoom factor high enough to expand the letter past the screen
            } else if (frameCount > 120) {
                scale = 121; // Hold at full zoom
            }

            // Calculate fade-in for Stage 2 text elements
            if (frameCount > 110) {
                let fadeT = Math.min(1, (frameCount - 110) / 30);
                opacity = fadeT;
            } else {
                opacity = 0;
            }

            // 3. Render Camera Pass Through Geometry
            ctx.translate(cx, cy);
            
            // Pivot the zoom target directly around the focal coordinates of the letter 'O'
            ctx.translate(-focalX * (scale - 1), 0);
            ctx.scale(scale, scale);

            // Draw the baseline boundary word
            ctx.fillStyle = "#000000";
            ctx.fillText(word, 0, 0);

            ctx.restore();

            // 4. Render Stage 2: Inverted Black Environment text
            if (frameCount > 110) {
                ctx.save();
                ctx.font = "500 36px sans-serif";
                ctx.fillStyle = `rgba(255, 255, 255, ${opacity})`;
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText("X EQUALS SIX", cx, cy);
                ctx.restore();
            }

            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        animate();
    </script>
</body>
</html>
