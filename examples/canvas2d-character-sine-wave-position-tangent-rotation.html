<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas 2D Per-Character Sine-Wave Position and Tangent Rotation</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <canvas id="waveCanvas"></canvas>

    <script>
        const canvas = document.getElementById('waveCanvas');
        const ctx = canvas.getContext('2d');

        // Set dimensions
        canvas.width = 800;
        canvas.height = 400;

        // Configuration
        const text = "TYPOGRAPHY FOLLOWING A MOVING WAVE ON CANVAS";
        const fontSize = 28;
        ctx.font = `bold ${fontSize}px sans-serif`;
        ctx.textBaseline = 'middle';

        // Wave Properties
        const wave = {
            amplitude: 50,    // Height of the peak
            frequency: 0.015,  // How tightly packed the waves are
            phase: 0,         // Changes over time to animate movement
            speed: 0.05,      // Animation speed
            centerY: canvas.height / 2
        };

        // Letter spacing buffer
        const letterSpacing = 2; 

        function animate() {
            // Clear canvas
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Increment phase to make the wave move
            wave.phase += wave.speed;

            let currentX = 50; 

            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                const charWidth = ctx.measureText(char).width;

                // 1. Calculate the target point on the wave (middle of the letter)
                const targetX = currentX + charWidth / 2;
                const targetY = wave.centerY + Math.sin(targetX * wave.frequency + wave.phase) * wave.amplitude;

                // 2. Calculate the slope (derivative) to find the tangent angle
                // Derivative of sin(k*x + p) is k * cos(k*x + p)
                const slope = wave.amplitude * wave.frequency * Math.cos(targetX * wave.frequency + wave.phase);
                const angle = Math.atan(slope);

                // 3. Draw the character using transformations
                ctx.save();
                
                // Move origin to the specific point on the wave
                ctx.translate(targetX, targetY);
                // Rotate the canvas context to match the wave's angle
                ctx.rotate(angle);
                
                // Draw text with cycling hue
                ctx.fillStyle = `hsl(${(i * 360 / text.length) + (wave.phase * 20)}, 80%, 65%)`;
                
                // Draw letter offset by half width so it centers on the coordinate
                ctx.fillText(char, -charWidth / 2, 0);
                
                ctx.restore();

                // Advance X coordinate for the next letter
                currentX += charWidth + letterSpacing;
            }

            requestAnimationFrame(animate);
        }

        // Start animation loop
        animate();
    </script>
</body>
</html>
