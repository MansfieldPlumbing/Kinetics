<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <title>React Canvas 2D RGB Channel Offset Text</title>
    <script type="module" crossorigin>
import { jsx, jsxs } from 'https://widgetlibs.static.usercontent.goog/react/jsx-runtime-Dc9ViRTo.js';
import React, { useState, useRef, useEffect } from 'https://widgetlibs.static.usercontent.goog/react-Dd1pKoqe.js';
import ReactDOM from 'https://widgetlibs.static.usercontent.goog/react-dom/client-BTuQ-l8_.js';
import { ErrorBoundary } from 'https://widgetlibs.static.usercontent.goog/react-error-boundary-BY2GTZrN.js';
import * as ToggleGroup from 'https://widgetlibs.static.usercontent.goog/@radix-ui/react-toggle-group-SAzue8E6.js';
import * as Slider from 'https://widgetlibs.static.usercontent.goog/@radix-ui/react-slider-DXk-CvUR.js';

const ErrorFallback = ({ error }) => jsxs("div", { className: "p-6 text-error bg-card rounded-xl", children: [
  jsx("p", { className: "text-sm font-medium", children: "Something went wrong with the simulation:" }),
  jsx("pre", { className: "text-xs mt-2 overflow-auto max-w-full", children: error.message })
] });

const PHRASES = [
  "KINETIC",
  "GLITCH",
  "VELOCITY",
  "ECHOES"
];

function App() {
  return jsx(ErrorBoundary, { FallbackComponent: ErrorFallback, children: jsx(RgbChannelOffsetTextWidget, {}) });
}

function RgbChannelOffsetTextWidget() {
  const [activePhrase, setActivePhrase] = useState("KINETIC");
  const [aberrationAmount, setAberrationAmount] = useState(35);
  const [trailLength, setTrailLength] = useState(0.25);
  const [isPlaying, setIsPlaying] = useState(true);
  const containerRef = useRef(null);
  const canvasRef = useRef(null);
  const [dimensions, setDimensions] = useState({ width: 640, height: 360 });
  const isPlayingRef = useRef(true);
  const timeRef = useRef(0);
  const mouseRef = useRef({ x: 0, y: 0, targetX: 0, targetY: 0, vx: 0, vy: 0, lastX: 0, lastY: 0 });
  const isHoveredRef = useRef(false);

  useEffect(() => {
    isPlayingRef.current = isPlaying;
  }, [isPlaying]);

  useEffect(() => {
    if (!containerRef.current) return;
    const handleResize = () => {
      if (!containerRef.current) return;
      const width = containerRef.current.clientWidth || 640;
      const height = Math.floor(width * 0.52);
      setDimensions({ width, height });
    };
    handleResize();
    window.addEventListener("resize", handleResize);
    return () => window.removeEventListener("resize", handleResize);
  }, []);

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    if (!ctx) return;
    let localFrameId;

    const tick = () => {
      if (!isPlayingRef.current) {
        localFrameId = requestAnimationFrame(tick);
        return;
      }
      timeRef.current += 0.04;
      const t = timeRef.current;
      const { width, height } = dimensions;
      const mouse = mouseRef.current;

      mouse.x += (mouse.targetX - mouse.x) * 0.12;
      mouse.y += (mouse.targetY - mouse.y) * 0.12;
      mouse.vx = mouse.x - mouse.lastX;
      mouse.vy = mouse.y - mouse.lastY;
      mouse.lastX = mouse.x;
      mouse.lastY = mouse.y;

      ctx.fillStyle = "#0b0f19";
      ctx.globalCompositeOperation = "source-over";
      ctx.fillRect(0, 0, width, height);

      const baseFontSize = Math.min(width * 0.14, 84);
      ctx.font = `500 ${baseFontSize}px "Google Sans", "Roboto", sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      const centerX = width / 2;
      const centerY = height / 2;
      const waveX = Math.sin(t * 1.2) * (width * 0.04);
      const waveY = Math.cos(t * 0.8) * (height * 0.03);

      const targetTextX = centerX + waveX;
      const targetTextY = centerY + waveY;

      const velocityInfluenceX = mouse.vx * 1.5;
      const velocityInfluenceY = mouse.vy * 1.5;
      const waveSplitX = Math.cos(t * 2) * (aberrationAmount * 0.4);
      const waveSplitY = Math.sin(t * 1.8) * (aberrationAmount * 0.4);
      const shiftX = waveSplitX + velocityInfluenceX;
      const shiftY = waveSplitY + velocityInfluenceY;

      ctx.globalCompositeOperation = "screen";

      // Red channel
      ctx.fillStyle = "#ff3366";
      ctx.fillText(activePhrase, targetTextX + shiftX, targetTextY + shiftY);

      // Green channel
      ctx.fillStyle = "#33ff66";
      ctx.fillText(activePhrase, targetTextX - shiftX * 0.4, targetTextY - shiftY * 0.4);

      // Blue channel
      ctx.fillStyle = "#3366ff";
      ctx.fillText(activePhrase, targetTextX + shiftX * 0.2, targetTextY - shiftY * 1.2);

      // Secondary ghost echoes
      ctx.font = `500 ${baseFontSize * 0.95}px "Google Sans", sans-serif`;
      ctx.fillStyle = "rgba(51, 255, 102, 0.15)";
      ctx.fillText(activePhrase, targetTextX - shiftX * 2, targetTextY - shiftY * 1.5);

      ctx.fillStyle = "rgba(255, 51, 102, 0.12)";
      ctx.fillText(activePhrase, targetTextX + shiftX * 1.8, targetTextY + shiftY * 2);

      localFrameId = requestAnimationFrame(tick);
    };

    localFrameId = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(localFrameId);
  }, [dimensions, activePhrase, aberrationAmount, trailLength]);

  const handlePointerMove = (e) => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const rect = canvas.getBoundingClientRect();
    mouseRef.current.targetX = e.clientX - rect.left;
    mouseRef.current.targetY = e.clientY - rect.top;
    if (!isHoveredRef.current) {
      mouseRef.current.x = mouseRef.current.targetX;
      mouseRef.current.y = mouseRef.current.targetY;
      mouseRef.current.lastX = mouseRef.current.targetX;
      mouseRef.current.lastY = mouseRef.current.targetY;
      isHoveredRef.current = true;
    }
  };

  const handlePointerLeave = () => {
    isHoveredRef.current = false;
    mouseRef.current.targetX = dimensions.width / 2;
    mouseRef.current.targetY = dimensions.height / 2;
  };

  const currentTotalAberration = Math.sqrt(
    Math.pow(Math.cos(timeRef.current * 2) * (aberrationAmount * 0.4) + mouseRef.current.vx * 1.5, 2) +
    Math.pow(Math.sin(timeRef.current * 1.8) * (aberrationAmount * 0.4) + mouseRef.current.vy * 1.5, 2)
  );

  return jsxs("div", { ref: containerRef, className: "w-full bg-card text-foreground flex flex-col select-none overflow-hidden", children: [
    jsxs("div", { className: "relative w-full overflow-hidden border-b border-border bg-[#0b0f19]", children: [
      jsx("canvas", {
        ref: canvasRef,
        width: dimensions.width,
        height: dimensions.height,
        onPointerMove: handlePointerMove,
        onPointerLeave: handlePointerLeave,
        className: "block w-full touch-none cursor-crosshair",
        style: { height: dimensions.height }
      }),
      jsx("div", { className: "absolute top-0 right-0 p-3 z-10 flex items-center justify-end pointer-events-none", children:
        jsx("button", {
          onClick: () => setIsPlaying(!isPlaying),
          onMouseDown: (e) => e.stopPropagation(),
          onTouchStart: (e) => e.stopPropagation(),
          className: "w-9 h-9 rounded-full flex items-center justify-center cursor-pointer transition-colors shadow-none bg-muted/90 hover:bg-secondary-hover text-foreground pointer-events-auto relative overflow-visible after:absolute after:-inset-1",
          "aria-label": isPlaying ? "Pause simulation motion" : "Play simulation motion",
          children: jsx("span", { className: "material-icons !text-base", children: isPlaying ? "pause" : "play_arrow" })
        })
      })
    ] }),
    jsxs("div", { className: "flex items-center justify-center gap-x-4 sm:gap-x-8 md:gap-x-12 border-b border-border px-5 py-3 shrink-0", children: [
      jsxs("div", { className: "flex flex-col items-center gap-0.5 min-w-0 flex-1", children: [
        jsx("span", { className: "text-xs text-muted-foreground font-medium truncate text-center w-full", children: "Split Amount" }),
        jsxs("span", { className: "text-sm font-medium text-foreground tabular-nums truncate text-center w-full", children: [currentTotalAberration.toFixed(1), " px"] })
      ] }),
      jsxs("div", { className: "flex flex-col items-center gap-0.5 min-w-0 flex-1", children: [
        jsx("span", { className: "text-xs text-muted-foreground font-medium truncate text-center w-full", children: "Peak Offset" }),
        jsxs("span", { className: "text-sm font-medium text-foreground tabular-nums truncate text-center w-full", children: [aberrationAmount.toFixed(0), " px"] })
      ] }),
      jsxs("div", { className: "flex flex-col items-center gap-0.5 min-w-0 flex-1", children: [
        jsx("span", { className: "text-xs text-muted-foreground font-medium truncate text-center w-full", children: "Blend Target" }),
        jsx("span", { className: "text-sm font-medium text-foreground tabular-nums truncate text-center w-full", children: "RGB Screen" })
      ] })
    ] }),
    jsxs("div", { className: "p-5 flex flex-col gap-4", children: [
      jsxs("div", { className: "flex flex-col gap-1.5", children: [
        jsx("label", { className: "text-sm font-medium text-muted-foreground", children: "Phrase String" }),
        jsx(ToggleGroup.Root, {
          type: "single",
          value: activePhrase,
          onValueChange: (val) => { if (val) setActivePhrase(val); },
          className: "rounded-full flex w-full bg-muted h-9 p-1",
          "aria-label": "Select typography text phrase",
          children: PHRASES.map((p) => jsx(ToggleGroup.Item, {
            value: p,
            title: p,
            className: "flex-1 min-w-0 text-center px-2 rounded-full text-xs sm:text-sm font-medium transition-colors cursor-pointer relative data-[state=on]:bg-primary data-[state=on]:text-white overflow-visible after:absolute after:-inset-y-2 after:inset-x-0",
            children: jsx("span", { className: "truncate block w-full", children: p })
          }, p))
        })
      ] }),
      jsxs("div", { className: "flex flex-col gap-1", children: [
        jsx("label", { className: "text-sm font-medium text-muted-foreground", children: "Aberration Magnitude" }),
        jsxs("div", { className: "flex items-center gap-3 w-full", children: [
          jsxs(Slider.Root, {
            min: 5,
            max: 100,
            step: 1,
            value: [aberrationAmount],
            onValueChange: (val) => setAberrationAmount(val[0]),
            className: "relative flex items-center grow touch-none select-none h-11 cursor-pointer py-3 -my-3",
            "aria-label": "Adjust chromatic aberration amount",
            children: [
              jsx(Slider.Track, { className: "relative grow rounded-full h-1 !bg-muted", children: jsx(Slider.Range, { className: "absolute h-full bg-primary rounded-full" }) }),
              jsx(Slider.Thumb, {
                className: "block w-[18px] h-[18px] rounded-full bg-primary border-none shadow-none relative after:absolute after:top-1/2 after:left-1/2 after:-translate-x-1/2 after:-translate-y-1/2 after:w-11 after:h-11",
                "aria-label": "Aberration value slider handle"
              })
            ]
          }),
          jsxs("span", { className: "text-sm font-medium tabular-nums text-right shrink-0 whitespace-nowrap w-[6ch]", children: [aberrationAmount, " px"] })
        ] })
      ] })
    ] })
  ] });
}

ReactDOM.createRoot(document.getElementById("root")).render(
  jsx(React.StrictMode, { children: jsx(App, {}) })
);
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
