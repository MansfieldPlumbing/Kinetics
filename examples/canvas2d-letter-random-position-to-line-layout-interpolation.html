<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Canvas 2D Letter Random-Position to Line-Layout Interpolation</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #05070a;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
  }
  canvas { display: block; border: 1px solid #10161c; }
</style>
</head>
<body>
<canvas id="c" width="960" height="540"></canvas>
<script>
/**
 * Per-letter position interpolation.
 * Letters start at random positions, interpolate to fixed line-layout positions,
 * hold, and then interpolate to new random positions.
 */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const phrases = ["ASSEMBLE", "INTERPOLATE", "MOVE TO TARGET", "HOLD POSITION"];
let phraseIndex = 0;
let letters = [];
let state = 'enter';
let stateFrame = 0;
const DURS = { enter: 45, hold: 50, exit: 35 };

function cubicOut(t) { return 1 - Math.pow(1 - t, 3); }
function cubicIn(t) { return t * t * t; }

function layoutPhrase(text) {
  ctx.font = '900 64px "Arial Black", sans-serif';
  const chars = text.split('');
  const widths = chars.map(c => ctx.measureText(c).width);
  const totalW = widths.reduce((a, b) => a + b, 0);
  let x = -totalW / 2;
  return chars.map((c, i) => {
    const w = widths[i];
    const cx = x + w / 2;
    x += w;
    return { char: c, tx: cx, ty: 0 };
  });
}

function randomPos(radiusMin, radiusMax) {
  const angle = Math.random() * Math.PI * 2;
  const r = radiusMin + Math.random() * (radiusMax - radiusMin);
  return { x: Math.cos(angle) * r, y: Math.sin(angle) * r };
}

function startEnter() {
  const layout = layoutPhrase(phrases[phraseIndex]);
  letters = layout.map(l => {
    const start = randomPos(350, 650);
    return {
      char: l.char, tx: l.tx, ty: l.ty,
      sx: start.x, sy: start.y,
      x: start.x, y: start.y,
      rotStart: (Math.random() - 0.5) * 6,
      rot: 0, scale: 0.2, alpha: 0
    };
  });
  state = 'enter'; stateFrame = 0;
}

function startExit() {
  letters.forEach(l => {
    const end = randomPos(350, 650);
    l.ex = end.x; l.ey = end.y;
    l.rotEnd = (Math.random() - 0.5) * 8;
  });
  state = 'exit'; stateFrame = 0;
}

startEnter();

function draw() {
  ctx.fillStyle = '#05070a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.strokeStyle = 'rgba(80,140,160,0.06)';
  ctx.lineWidth = 1;
  for (let gx = 0; gx < canvas.width; gx += 40) { ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, canvas.height); ctx.stroke(); }
  for (let gy = 0; gy < canvas.height; gy += 40) { ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(canvas.width, gy); ctx.stroke(); }

  stateFrame++;

  if (state === 'enter') {
    const t = Math.min(stateFrame / DURS.enter, 1);
    const e = cubicOut(t);
    letters.forEach(l => {
      l.x = l.sx + (l.tx - l.sx) * e;
      l.y = l.sy + (l.ty - l.sy) * e;
      l.rot = l.rotStart * (1 - e);
      l.scale = 0.2 + 0.8 * e;
      l.alpha = e;
    });
    if (t >= 1) { state = 'hold'; stateFrame = 0; }
  } else if (state === 'hold') {
    letters.forEach((l, i) => {
      l.x = l.tx; l.y = l.ty;
      l.rot = Math.sin(stateFrame * 0.05 + i) * 0.02;
      l.scale = 1; l.alpha = 1;
    });
    if (stateFrame >= DURS.hold) { startExit(); }
  } else if (state === 'exit') {
    const t = Math.min(stateFrame / DURS.exit, 1);
    const e = cubicIn(t);
    letters.forEach(l => {
      l.x = l.tx + (l.ex - l.tx) * e;
      l.y = l.ty + (l.ey - l.ty) * e;
      l.rot = l.rotEnd * e;
      l.alpha = 1 - e;
    });
    if (t >= 1) {
      phraseIndex = (phraseIndex + 1) % phrases.length;
      startEnter();
    }
  }

  ctx.save();
  ctx.translate(canvas.width / 2, canvas.height / 2);
  ctx.font = '900 64px "Arial Black", sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  letters.forEach(l => {
    ctx.save();
    ctx.translate(l.x, l.y);
    ctx.rotate(l.rot);
    ctx.scale(l.scale, l.scale);
    ctx.globalAlpha = l.alpha;
    ctx.shadowColor = 'rgba(80,220,255,0.8)';
    ctx.shadowBlur = 18 * l.alpha;
    ctx.fillStyle = '#eafcff';
    ctx.fillText(l.char, 0, 0);
    ctx.restore();
  });
  ctx.restore();

  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
