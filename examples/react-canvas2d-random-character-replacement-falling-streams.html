<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <title>React Canvas 2D Random Character Replacement with Falling Streams</title>
    <script type="module" crossorigin>
import { jsx, jsxs } from 'https://widgetlibs.static.usercontent.goog/react/jsx-runtime-Dc9ViRTo.js';
import React, { useRef, useState, useEffect } from 'https://widgetlibs.static.usercontent.goog/react-Dd1pKoqe.js';
import ReactDOM from 'https://widgetlibs.static.usercontent.goog/react-dom/client-BTuQ-l8_.js';
import { ErrorBoundary } from 'https://widgetlibs.static.usercontent.goog/react-error-boundary-BY2GTZrN.js';
import * as Slider from 'https://widgetlibs.static.usercontent.goog/@radix-ui/react-slider-DXk-CvUR.js';

const ErrorFallback = ({ error }) => jsxs("div", { className: "p-5 text-center bg-card text-error rounded-lg border border-border", children: [
  jsx("p", { className: "text-sm font-medium", children: "Failed to load character-replacement example" }),
  jsx("p", { className: "text-xs font-normal opacity-80 mt-1", children: error.message })
] });

const SOURCE_CHARS = "ｦｱｳｴｵｶｷｹｹｺｻｼｽｾｿﾀﾂﾃﾅﾆﾇﾈﾊﾋﾎﾏﾐﾑﾒﾓﾔﾕﾗﾘﾜ1234567890ABCDEFGHIJKLMNOPQRSTUVWXYZ<>[]{}*#$+%@&";

function App() {
  return jsx(ErrorBoundary, { FallbackComponent: ErrorFallback, children: jsx(RandomCharacterReplacementWidget, {}) });
}

function RandomCharacterReplacementWidget() {
  const containerRef = useRef(null);
  const canvasRef = useRef(null);
  const [inputText, setInputText] = useState("SYSTEM DECRYPTION SUCCESS");
  const [speed, setSpeed] = useState(60);
  const [isPlaying, setIsPlaying] = useState(true);
  const [progress, setProgress] = useState(0);
  const [entropy, setEntropy] = useState(100);
  const [dimensions, setDimensions] = useState({ width: 600, height: 300 });

  const isPlayingRef = useRef(isPlaying);
  const speedRef = useRef(speed);
  const textRef = useRef(inputText);
  const scrambleStateRef = useRef({
    currentChars: [],
    targetChars: [],
    resolvedIndices: new Set(),
    tickCount: 0
  });
  const bgStreamsRef = useRef([]);

  useEffect(() => {
    isPlayingRef.current = isPlaying;
  }, [isPlaying]);

  useEffect(() => {
    speedRef.current = speed;
  }, [speed]);

  useEffect(() => {
    textRef.current = inputText;
    const target = inputText.split("");
    const initial = target.map(() => SOURCE_CHARS[Math.floor(Math.random() * SOURCE_CHARS.length)]);
    scrambleStateRef.current = {
      currentChars: initial,
      targetChars: target,
      resolvedIndices: new Set(),
      tickCount: 0
    };
    setProgress(0);
    setEntropy(100);
  }, [inputText]);

  useEffect(() => {
    if (!containerRef.current) return;
    const handleResize = () => {
      const w = containerRef.current?.getBoundingClientRect().width || 600;
      const h = w * 0.5;
      setDimensions({ width: w, height: h });
      const columns = Math.floor(w / 14);
      const tempStreams = [];
      for (let i = 0; i < columns; i++) {
        tempStreams.push({
          x: i * 14,
          y: Math.random() * -h,
          speed: 2 + Math.random() * 5,
          chars: Array.from(
            { length: 10 + Math.floor(Math.random() * 15) },
            () => SOURCE_CHARS[Math.floor(Math.random() * SOURCE_CHARS.length)]
          )
        });
      }
      bgStreamsRef.current = tempStreams;
    };
    handleResize();
    const observer = new ResizeObserver(handleResize);
    if (containerRef.current) observer.observe(containerRef.current);
    return () => observer.disconnect();
  }, []);

  useEffect(() => {
    let animationFrameId;
    const render = () => {
      if (!isPlayingRef.current) {
        animationFrameId = requestAnimationFrame(render);
        return;
      }
      const canvas = canvasRef.current;
      if (!canvas) {
        animationFrameId = requestAnimationFrame(render);
        return;
      }
      const ctx = canvas.getContext("2d");
      if (!ctx) {
        animationFrameId = requestAnimationFrame(render);
        return;
      }
      const { width, height } = dimensions;

      // Background fade trail
      ctx.fillStyle = "rgba(10, 15, 13, 0.15)";
      ctx.fillRect(0, 0, width, height);
      ctx.font = "11px monospace";

      // Falling code streams
      bgStreamsRef.current.forEach((stream) => {
        stream.chars.forEach((char, idx) => {
          const charY = stream.y + idx * 14;
          if (charY > 0 && charY < height) {
            if (idx === 0) {
              ctx.fillStyle = "rgba(180, 255, 200, 0.9)";
            } else {
              ctx.fillStyle = `rgba(0, 255, 102, ${Math.max(0.05, 0.4 - idx * 0.03)})`;
            }
            ctx.fillText(char, stream.x, charY);
          }
        });
        stream.y += stream.speed * (speedRef.current / 60);
        if (stream.y > height) {
          stream.y = Math.random() * -60;
          stream.speed = 2 + Math.random() * 5;
        }
        if (Math.random() < 0.02) {
          stream.chars[Math.floor(Math.random() * stream.chars.length)] =
            SOURCE_CHARS[Math.floor(Math.random() * SOURCE_CHARS.length)];
        }
      });

      // Decryption resolution logic
      const state = scrambleStateRef.current;
      state.tickCount += 1;
      const threshold = Math.max(1, Math.floor(12 - speedRef.current / 10));

      if (state.tickCount % threshold === 0) {
        const total = state.targetChars.length;
        if (total > 0 && state.resolvedIndices.size < total) {
          let nextToResolve = 0;
          while (nextToResolve < total && state.resolvedIndices.has(nextToResolve)) {
            nextToResolve++;
          }
          if (nextToResolve < total) {
            state.resolvedIndices.add(nextToResolve);
            state.currentChars[nextToResolve] = state.targetChars[nextToResolve];
          }
          const currentProgress = Math.round((state.resolvedIndices.size / total) * 100);
          setProgress(currentProgress);
          setEntropy(Math.max(0, 100 - currentProgress));
        }

        for (let i = 0; i < total; i++) {
          if (!state.resolvedIndices.has(i)) {
            state.currentChars[i] = SOURCE_CHARS[Math.floor(Math.random() * SOURCE_CHARS.length)];
          }
        }
      }

      // Center decryption string rendering
      ctx.font = "font-medium 20px 'Google Sans', 'Roboto', monospace";
      if (width < 450) {
        ctx.font = "font-medium 14px 'Google Sans', 'Roboto', monospace";
      }
      const txt = state.currentChars.join("");
      const textWidth = ctx.measureText(txt).width;
      const startX = (width - textWidth) / 2;
      const startY = height / 2;

      ctx.fillStyle = "rgba(0, 255, 102, 0.03)";
      ctx.beginPath();
      ctx.roundRect(startX - 15, startY - 26, textWidth + 30, 42, 8);
      ctx.fill();

      let currentX = startX;
      for (let i = 0; i < state.currentChars.length; i++) {
        const char = state.currentChars[i];
        const isResolved = state.resolvedIndices.has(i);
        const isScanningHead = !isResolved && state.resolvedIndices.has(i - 1);

        if (isScanningHead) {
          ctx.fillStyle = "#ffffff";
          ctx.shadowColor = "#00ff66";
          ctx.shadowBlur = 12;
        } else if (isResolved) {
          ctx.fillStyle = "#ecfdf5";
          ctx.shadowBlur = 0;
        } else {
          ctx.fillStyle = "#00ff66";
          ctx.shadowColor = "#00ff66";
          ctx.shadowBlur = 4;
        }

        ctx.fillText(char, currentX, startY);
        currentX += ctx.measureText(char).width;
        ctx.shadowBlur = 0;
      }

      // Loop restart
      if (state.resolvedIndices.size === state.targetChars.length && state.targetChars.length > 0) {
        if (state.tickCount % 220 === 0) {
          const target = textRef.current.split("");
          scrambleStateRef.current = {
            currentChars: target.map(() => SOURCE_CHARS[Math.floor(Math.random() * SOURCE_CHARS.length)]),
            targetChars: target,
            resolvedIndices: new Set(),
            tickCount: 0
          };
          setProgress(0);
          setEntropy(100);
        }
      }

      animationFrameId = requestAnimationFrame(render);
    };

    render();
    return () => cancelAnimationFrame(animationFrameId);
  }, [dimensions]);

  return jsxs("div", { ref: containerRef, className: "w-full bg-card text-foreground flex flex-col font-sans overflow-hidden select-none", children: [
    jsxs("div", { className: "relative w-full overflow-hidden border-b border-border", children: [
      jsx("canvas", {
        ref: canvasRef,
        width: dimensions.width,
        height: dimensions.height,
        className: "block w-full h-auto bg-card"
      }),
      jsx("div", { className: "absolute top-0 right-0 p-3 z-10 flex items-center justify-end pointer-events-none", children:
        jsx("button", {
          onClick: () => setIsPlaying(!isPlaying),
          onMouseDown: (e) => e.stopPropagation(),
          onTouchStart: (e) => e.stopPropagation(),
          className: "w-9 h-9 rounded-full flex items-center justify-center cursor-pointer transition-colors shadow-none bg-muted/90 hover:bg-secondary-hover text-foreground pointer-events-auto relative overflow-visible after:absolute after:-inset-1",
          "aria-label": isPlaying ? "Pause decryption animation" : "Play decryption animation",
          children: jsx("span", { className: "material-icons !text-base", children: isPlaying ? "pause" : "play_arrow" })
        })
      })
    ] }),
    jsxs("div", { className: "flex items-center justify-center gap-x-4 sm:gap-x-8 md:gap-x-12 border-b border-border px-5 py-3 shrink-0", children: [
      jsxs("div", { className: "flex flex-col items-center gap-0.5 min-w-0 flex-1", children: [
        jsx("span", { className: "text-xs text-muted-foreground font-medium truncate text-center w-full", children: "Progress" }),
        jsxs("span", { className: "text-sm font-medium text-foreground tabular-nums truncate text-center w-full", children: [progress, "%"] })
      ] }),
      jsxs("div", { className: "flex flex-col items-center gap-0.5 min-w-0 flex-1", children: [
        jsx("span", { className: "text-xs text-muted-foreground font-medium truncate text-center w-full", children: "Decryption speed" }),
        jsxs("span", { className: "text-sm font-medium text-foreground tabular-nums truncate text-center w-full", children: [(speed * 0.4).toFixed(1), " c/s"] })
      ] }),
      jsxs("div", { className: "flex flex-col items-center gap-0.5 min-w-0 flex-1", children: [
        jsx("span", { className: "text-xs text-muted-foreground font-medium truncate text-center w-full", children: "Signal entropy" }),
        jsxs("span", { className: "text-sm font-medium text-foreground tabular-nums truncate text-center w-full", children: [entropy, "%"] })
      ] })
    ] }),
    jsxs("div", { className: "p-5 flex flex-col gap-4", children: [
      jsxs("div", { className: "flex flex-col gap-1.5", children: [
        jsx("label", { className: "text-sm font-medium text-muted-foreground", children: "Target decrypt phrase" }),
        jsx("input", {
          type: "text",
          value: inputText,
          maxLength: 32,
          onChange: (e) => setInputText(e.target.value || "TEXT"),
          className: "h-11 w-full border-t-[4px] border-b-[4px] border-transparent bg-clip-padding rounded-lg bg-muted text-sm font-medium px-2.5 focus:outline-none focus:ring-1 focus:ring-primary",
          placeholder: "Type custom message..."
        })
      ] }),
      jsxs("div", { className: "flex flex-col gap-1.5", children: [
        jsx("label", { className: "text-sm font-medium text-muted-foreground", children: "Scramble dynamic frequency" }),
        jsxs("div", { className: "flex items-center gap-3 w-full", children: [
          jsxs(Slider.Root, {
            className: "relative flex items-center grow touch-none select-none h-11 cursor-pointer py-3 -my-3",
            value: [speed],
            onValueChange: (val) => setSpeed(val[0]),
            min: 20,
            max: 100,
            step: 1,
            "aria-label": "Simulation scramble speed frequency",
            children: [
              jsx(Slider.Track, { className: "relative grow rounded-full h-1 !bg-muted", children: jsx(Slider.Range, { className: "absolute h-full bg-primary rounded-full" }) }),
              jsx(Slider.Thumb, {
                className: "block w-[18px] h-[18px] rounded-full bg-primary border-none shadow-none relative after:absolute after:top-1/2 after:left-1/2 after:-translate-x-1/2 after:-translate-y-1/2 after:w-11 after:h-11",
                "aria-label": "Speed frequency slider handle"
              })
            ]
          }),
          jsxs("span", { className: "text-sm font-medium tabular-nums text-right shrink-0 whitespace-nowrap w-[6ch]", children: [speed, "Hz"] })
        ] })
      ] })
    ] })
  ] });
}

ReactDOM.createRoot(document.getElementById("root")).render(
  jsx(React.StrictMode, { children: jsx(App, {}) })
);
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
